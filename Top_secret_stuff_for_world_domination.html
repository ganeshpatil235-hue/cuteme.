<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubber Sheet Stretchable Image</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      overflow: hidden;
    }

    h1 {
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    p {
      color: #94a3b8;
      margin-bottom: 2.5rem;
    }

    .container {
      position: relative;
    }

    .stretch-wrapper {
      position: relative;
      cursor: grab;
      touch-action: none;
      will-change: transform;
    }

    .stretch-wrapper:active {
      cursor: grabbing;
    }

    .stretch-image {
      width: 720px;
      height: 650px; 
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
      pointer-events: none; /* Prevents default browser image dragging */
      display: block;
    }
  </style>
</head>
<body>

  <h1>Interactive Elastic Image Of Me</h1>
  <p>Be gental !, That's my child self, and they're too fragile forthat weight, ok!</p>

  <div class="container">
    <div class="stretch-wrapper" id="rubberTarget">
      <img 
        src="CUTEME.PNG.png"
        alt=cuteme
        class="stretch-image"
        draggable="false"
      />
    </div>
  </div>

  <script>
    const target = document.getElementById('rubberTarget');

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    
    // Physics variables for displacement and spring bounce
    let currentDx = 0;
    let currentDy = 0;
    let velocityX = 0;
    let velocityY = 0;
    
    // Configurable spring physics constants
    const STIFFNESS = 0.12;   // Spring tension (higher = snaps back faster)
    const DAMPING = 0.72;     // Friction/bounciness (lower = bounces longer)
    const RESISTANCE = 0.003; // Stretch sensitivity factor
    
    let animationFrameId = null;

    // Handle Pointer Down (Mouse click or Touch start)
    target.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      
      target.setPointerCapture(e.pointerId);
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    });

    // Handle Pointer Move (Dragging)
    target.addEventListener('pointermove', (e) => {
      if (!isDragging) return;

      currentDx = e.clientX - startX;
      currentDy = e.clientY - startY;

      applyRubberTransform(currentDx, currentDy);
    });

    // Handle Pointer Up / Release
    const handleRelease = (e) => {
      if (!isDragging) return;
      isDragging = false;

      try {
        target.releasePointerCapture(e.pointerId);
      } catch (err) {}

      // Trigger the elastic snap-back loop
      animateSpringBack();
    };

    target.addEventListener('pointerup', handleRelease);
    target.addEventListener('pointercancel', handleRelease);

    // Function to calculate angle, stretch, and squeeze deformations
    function applyRubberTransform(dx, dy) {
      const distance = Math.hypot(dx, dy);
      if (distance === 0) {
        target.style.transform = 'none';
        return;
      }

      const angle = Math.atan2(dy, dx); // Angle of drag direction in radians
      
      // Rubber deformation: elongate along drag axis, compress on perpendicular axis
      const stretch = 1 + distance * RESISTANCE;
      const squeeze = 1 / (1 + distance * (RESISTANCE * 0.6));

      const angleDeg = (angle * 180) / Math.PI;

      // Rotate image to drag direction -> Stretch/Squeeze -> Rotate back -> Translate slightly
      target.style.transform = `
        translate(${dx * 0.25}px, ${dy * 0.25}px)
        rotate(${angleDeg}deg)
        scale(${stretch}, ${squeeze})
        rotate(${-angleDeg}deg)
      `;
    }

    // Spring physics animation loop on release
    function animateSpringBack() {
      // Hooke's Law: Force = -Stiffness * Displacement - Damping * Velocity
      const forceX = -STIFFNESS * currentDx;
      velocityX = (velocityX + forceX) * DAMPING;
      currentDx += velocityX;

      const forceY = -STIFFNESS * currentDy;
      velocityY = (velocityY + forceY) * DAMPING;
      currentDy += velocityY;

      applyRubberTransform(currentDx, currentDy);

      // Continue animation frame loop until spring settles near rest position
      if (
        Math.abs(currentDx) > 0.05 || 
        Math.abs(currentDy) > 0.05 || 
        Math.abs(velocityX) > 0.05 || 
        Math.abs(velocityY) > 0.05
      ) {
        animationFrameId = requestAnimationFrame(animateSpringBack);
      } else {
        currentDx = 0;
        currentDy = 0;
        velocityX = 0;
        velocityY = 0;
        target.style.transform = 'none';
      }
    }
  </script>
</body>
</html>
